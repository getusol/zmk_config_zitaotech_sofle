# ===== 定制的指针速度（右半 · 小红点）=====
#
# 真实公式（trackpoint_0x15.c）：
#   速度 = dx × (TRACKPOINT_MOUSE_BASE_SPEED_PERCENT/100)
#              × (TRACKPOINT_MOUSE_SENS_BASE_PERCENT/100
#                 + TRACKPOINT_MOUSE_SENS_STEP_PERCENT/100 × 背光亮度)
#
# 注意：这把键盘没有背光 LED ——「背光亮度」只是一个 0~100 的数值，
#       被驱动当成指针速度倍率用（同时决定状态灯亮度）。
#       所以下面把起始值钉死在 40，速度才是可预期的。
#
# 亮度 40 时的实际倍率：
#   原厂：0.50 × (0.30+0.40) = 0.35   ← 用户反馈"太低"
#   现在：1.00 × (0.30+0.40) = 0.70   ← 约 2 倍（粗调）
# 想再快：BASE_SPEED 改 130（→0.91）或 150（→1.05）
# 运行时微调：导航层里按 48/49（背光 -/+，每格 ±10 → 速度 ±0.10）

CONFIG_ZMK_BACKLIGHT_BRT_START=40
CONFIG_ZMK_BACKLIGHT_ON_START=y

CONFIG_TRACKPOINT_MOUSE_BASE_SPEED_PERCENT=100
CONFIG_TRACKPOINT_MOUSE_SENS_BASE_PERCENT=30
