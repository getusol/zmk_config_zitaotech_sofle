# ===== 定制的指针速度（左半 · 触控板）=====
#
# 重要：A320 的 CONFIG_A320_MOUSE_* 三个选项是**死选项**（代码里没引用），
#       速度写死在 custom_driver_left/a320.c 里：
#         速度 = dx × 5/8 × (0.40 + 0.01 × 背光亮度)
#       （原厂是 3/4，本仓库已改成 5/8 = 约 -17%）
#
# 亮度 40 时的实际倍率：
#   原厂：0.750 × 0.80 = 0.60   ← 用户反馈"略高"
#   现在：0.625 × 0.80 = 0.50   ← 约 -17%（微调）
# 想再慢：a320.c 里 5/8 改成 1/2（→0.40）或 2/5（→0.32）
#
# 这里把起始亮度钉死在 40，和右半保持一致（速度才可预期）

CONFIG_ZMK_BACKLIGHT_BRT_START=40
CONFIG_ZMK_BACKLIGHT_ON_START=y
